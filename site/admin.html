<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运营后台 · 鹊桥</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-login { max-width: 360px; margin: 48px auto; display: grid; gap: 14px; }
    .admin-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 20px 0; }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.data th, table.data td {
      border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top;
    }
    table.data th { background: rgba(20,28,46,.9); color: var(--gold); font-weight: 600; }
    table.data td { color: var(--muted); }
    table.data .ink { color: var(--ink); }
    .problem { max-width: 280px; white-space: pre-wrap; word-break: break-word; }
    .note-input { width: 100%; min-width: 120px; }
    select.status { min-width: 96px; }
    .section-title { margin: 28px 0 12px; font-size: 1.15rem; }
    .hidden { display: none !important; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8rem; }
    .badge.new { color: var(--gold); }
    .badge.contact { color: var(--ok); }
    .badge.done { color: var(--muted); }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><strong>鹊桥</strong><span>运营后台</span></a>
      <nav>
        <a href="/">介绍</a>
        <a href="/ask">接单页</a>
      </nav>
    </header>

    <section id="login-view" class="card admin-login">
      <h1 style="margin:0;font-size:1.3rem">运营后台</h1>
      <p class="hint" style="margin:0">输入口令后查看留言与客户名单。口令由服务器环境配置。</p>
      <div class="alert err" id="login-err"></div>
      <form id="login-form">
        <label>口令
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn primary" type="submit" style="margin-top:12px;width:100%">登录</button>
      </form>
    </section>

    <section id="dash-view" class="hidden">
      <div class="admin-bar">
        <h1 style="margin:0;font-size:1.4rem">留言与客户</h1>
        <button class="btn" type="button" id="logout-btn">退出</button>
      </div>
      <div class="alert err" id="dash-err"></div>

      <h2 class="section-title">留言列表</h2>
      <div class="card" style="overflow-x:auto;padding:0">
        <table class="data" id="msg-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>称呼</th>
              <th>联系方式</th>
              <th>系统</th>
              <th>问题</th>
              <th>状态</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <h2 class="section-title">客户名单</h2>
      <p class="hint">按联系方式归拢；同一人的多次留言会叠在一起。</p>
      <div class="card" style="overflow-x:auto;padding:0">
        <table class="data" id="cust-table">
          <thead>
            <tr>
              <th>称呼</th>
              <th>联系方式</th>
              <th>系统</th>
              <th>最近留言</th>
              <th>当前状态</th>
              <th>历史条数</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <h2 class="section-title" id="session-codes-title">会话码</h2>
      <p class="hint">只读事件流水（最新在前）。数据来自中继审计旁路；不展示密码、hash、凭证、指纹。</p>
      <div class="admin-bar" style="margin:0 0 12px;justify-content:flex-start;flex-wrap:wrap">
        <label style="display:flex;gap:8px;align-items:center;margin:0">按码过滤
          <input id="sc-code" type="text" placeholder="如 ABC123" style="width:140px" autocomplete="off">
        </label>
        <button class="btn" type="button" id="sc-refresh">查询</button>
      </div>
      <div class="alert err" id="sc-err"></div>
      <div class="card" style="overflow-x:auto;padding:0">
        <table class="data" id="sc-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>会话码</th>
              <th>事件</th>
              <th>失败原因</th>
              <th>角色</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
  <script>
    const loginView = document.getElementById("login-view");
    const dashView = document.getElementById("dash-view");
    const loginErr = document.getElementById("login-err");
    const dashErr = document.getElementById("dash-err");
    const statuses = ["新留言", "已联系", "已结束"];

    function fmtTime(sec) {
      if (!sec) return "";
      const d = new Date(sec * 1000);
      const p = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function contacts(o) {
      return [o.wechat && ("微信 " + o.wechat), o.phone && ("手机 " + o.phone), o.email && ("邮箱 " + o.email)].filter(Boolean).join(" / ");
    }
    function showErr(el, msg) {
      if (!msg) { el.classList.remove("show"); el.textContent = ""; return; }
      el.textContent = msg; el.classList.add("show");
    }
    function badgeClass(st) {
      if (st === "已联系") return "contact";
      if (st === "已结束") return "done";
      return "new";
    }

    async function api(path, opts) {
      const res = await fetch(path, Object.assign({ credentials: "same-origin" }, opts || {}));
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    async function refresh() {
      showErr(dashErr, "");
      const [m, c] = await Promise.all([
        api("/admin/api/messages"),
        api("/admin/api/customers"),
      ]);
      if (m.res.status === 401 || c.res.status === 401) {
        showLogin();
        return;
      }
      if (!m.data.ok || !c.data.ok) {
        showErr(dashErr, "加载失败，请刷新重试。");
        return;
      }
      renderMessages(m.data.messages || []);
      renderCustomers(c.data.customers || []);
      showDash();
      refreshSessionCodes();
    }

    async function refreshSessionCodes() {
      const scErr = document.getElementById("sc-err");
      showErr(scErr, "");
      const code = (document.getElementById("sc-code").value || "").trim();
      const q = code ? ("?code=" + encodeURIComponent(code)) : "";
      const { res, data } = await api("/admin/api/session-codes" + q);
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok || !data.ok) {
        showErr(scErr, (data && data.error) || "会话码加载失败");
        return;
      }
      if (data.configured === false) {
        showErr(scErr, data.hint || "未配置中继审计代理");
      }
      renderSessionCodes(data.events || []);
    }

    function renderSessionCodes(list) {
      const tb = document.querySelector("#sc-table tbody");
      tb.innerHTML = "";
      for (const e of list) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${fmtTime(e.ts)}</td>
          <td class="ink">${escapeHtml(e.code || "")}</td>
          <td><span class="badge">${escapeHtml(e.event || "")}</span></td>
          <td>${escapeHtml(e.fail_reason || "")}</td>
          <td>${escapeHtml(e.peer_role || "")}</td>`;
        tb.appendChild(tr);
      }
    }

    function renderMessages(list) {
      const tb = document.querySelector("#msg-table tbody");
      tb.innerHTML = "";
      for (const m of list) {
        const tr = document.createElement("tr");
        const sel = statuses.map(s => `<option value="${s}" ${s===m.status?"selected":""}>${s}</option>`).join("");
        tr.innerHTML = `
          <td>${fmtTime(m.created_at)}</td>
          <td class="ink">${escapeHtml(m.name)}</td>
          <td>${escapeHtml(contacts(m))}</td>
          <td>${escapeHtml(m.os)}</td>
          <td class="problem ink">${escapeHtml(m.problem)}</td>
          <td><select class="status" data-id="${m.id}">${sel}</select></td>
          <td>
            <input class="note-input" data-id="${m.id}" value="${escapeAttr(m.note || "")}" placeholder="备注">
          </td>`;
        tb.appendChild(tr);
      }
      tb.querySelectorAll("select.status").forEach(el => {
        el.addEventListener("change", async () => {
          const { res, data } = await api("/admin/api/status", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ id: Number(el.dataset.id), status: el.value }),
          });
          if (!res.ok || !data.ok) showErr(dashErr, "改状态失败");
          else refresh();
        });
      });
      tb.querySelectorAll("input.note-input").forEach(el => {
        el.addEventListener("change", async () => {
          const { res, data } = await api("/admin/api/note", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ id: Number(el.dataset.id), note: el.value }),
          });
          if (!res.ok || !data.ok) showErr(dashErr, "保存备注失败");
        });
      });
    }

    function renderCustomers(list) {
      const tb = document.querySelector("#cust-table tbody");
      tb.innerHTML = "";
      for (const c of list) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="ink">${escapeHtml(c.name)}</td>
          <td>${escapeHtml(contacts(c))}</td>
          <td>${escapeHtml(c.os)}</td>
          <td>${fmtTime(c.last_message_at)}</td>
          <td><span class="badge ${badgeClass(c.status)}">${escapeHtml(c.status || "")}</span></td>
          <td>${c.history_count}</td>`;
        tb.appendChild(tr);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, " "); }

    function showLogin() {
      loginView.classList.remove("hidden");
      dashView.classList.add("hidden");
    }
    function showDash() {
      loginView.classList.add("hidden");
      dashView.classList.remove("hidden");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showErr(loginErr, "");
      const fd = new FormData(e.target);
      const { res, data } = await api("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
        body: new URLSearchParams({ password: fd.get("password") }),
      });
      if (!res.ok || !data.ok) {
        showErr(loginErr, (data && data.error) || "口令不正确");
        return;
      }
      e.target.reset();
      refresh();
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api("/admin/logout", {
        method: "POST",
        headers: { "Accept": "application/json" },
      });
      showLogin();
    });

    document.getElementById("sc-refresh").addEventListener("click", refreshSessionCodes);
    document.getElementById("sc-code").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); refreshSessionCodes(); }
    });

    refresh();
  </script>
</body>
</html>
