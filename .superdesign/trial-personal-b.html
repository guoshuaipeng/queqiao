<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    :root {
      --primary: #2563eb;
      --surface: #ffffff;
      --bg: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --success: #16a34a;
    }
    body {
      font-family: 'Noto Sans SC', "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app-window {
      width: 840px;
      height: 512px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0,0,0,0.05);
    }
    .title-bar {
      height: 32px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
    .client-area {
      height: 480px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    .account-card {
      background: linear-gradient(135deg, #eff6ff 0%, #fefce8 100%);
      border: 1px solid rgba(37, 99, 235, 0.1);
    }
    .device-row {
      transition: all 0.2s ease;
      border: 1px solid var(--line);
    }
    .device-row:hover:not(.offline) {
      border-color: var(--primary);
      background-color: #f0f7ff;
    }
    .device-row.offline {
      background-color: #f8fafc;
      opacity: 0.75;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-slate-200 flex items-center justify-center p-4">
    <div class="app-window flex flex-col">
      <div class="title-bar">
        <span class="flex items-center gap-2">
          <iconify-icon icon="lucide:bridge" class="text-blue-600"></iconify-icon>
          鹊桥
        </span>
        <div class="ml-auto flex gap-4 text-gray-400">
          <iconify-icon icon="lucide:minus" class="cursor-pointer hover:text-gray-600"></iconify-icon>
          <iconify-icon icon="lucide:square" class="cursor-pointer hover:text-gray-600"></iconify-icon>
          <iconify-icon icon="lucide:x" class="cursor-pointer hover:text-red-500"></iconify-icon>
        </div>
      </div>

      <div class="client-area">
        <header class="px-8 pt-6 pb-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a id="btn-back" href="#" class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-100 transition-colors text-slate-500">
              <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
            </a>
            <h1 class="text-xl font-bold text-slate-900">个人中心</h1>
          </div>
          <button id="btn-logout" class="text-sm text-slate-500 hover:text-red-600 font-medium transition-colors">退出登录</button>
        </header>

        <div class="flex-1 px-8 pb-6 flex flex-col gap-5 overflow-hidden">
          <div class="account-card rounded-2xl p-4 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-white font-bold text-lg shadow-sm">
              张
            </div>
            <div class="flex-1">
              <h2 class="text-base font-bold text-slate-900">zhang_wei</h2>
              <div class="flex items-center gap-1.5 text-xs text-slate-500 mt-0.5">
                <iconify-icon icon="lucide:shield-check" class="text-blue-600"></iconify-icon>
                <span>已启用双重验证 · 安全等级：高</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button id="btn-manage-id" class="text-xs bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium hover:border-blue-400 hover:text-blue-600 transition-all">管理账号</button>
            </div>
          </div>

          <div class="flex items-center justify-between px-1">
            <div class="flex flex-col">
              <h3 class="text-[15px] font-bold text-slate-900">允许我的账号连接这台电脑</h3>
              <p class="text-xs text-slate-400 mt-0.5">开启后，您在其他设备上登录此账号即可直接发起控制</p>
            </div>
            <div id="toggle-switch" class="w-10 h-6 bg-blue-600 rounded-full relative cursor-pointer shadow-inner">
              <div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
            </div>
          </div>

          <div class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center justify-between mb-3 px-1">
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-slate-900">我的设备</span>
                <span class="text-xs text-slate-400">(3)</span>
              </div>
              <button id="btn-refresh" class="flex items-center gap-1 text-xs text-blue-600 hover:text-blue-700 font-medium">
                <iconify-icon icon="lucide:rotate-cw" class="text-sm"></iconify-icon>
                刷新列表
              </button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1 space-y-3 custom-scrollbar">
              <div class="device-row rounded-xl p-3.5 flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">
                  <iconify-icon icon="lucide:monitor" class="text-2xl"></iconify-icon>
                </div>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-slate-900">家里的台式机</span>
                    <span class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-[10px] font-bold uppercase tracking-wider">本机</span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                    <span class="text-xs text-slate-500">Windows 11 · 在线</span>
                  </div>
                </div>
                <span class="text-xs text-slate-400">运行中</span>
              </div>

              <div class="device-row rounded-xl p-3.5 flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                  <iconify-icon icon="lucide:laptop" class="text-2xl"></iconify-icon>
                </div>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-slate-900">公司笔记本</span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-xs text-slate-500">Windows 10 · 在线</span>
                  </div>
                </div>
                <button id="btn-connect-remote" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition-all shadow-sm active:scale-95">连接</button>
              </div>

              <div class="device-row offline rounded-xl p-3.5 flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400">
                  <iconify-icon icon="lucide:monitor-off" class="text-2xl"></iconify-icon>
                </div>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-slate-500">书房电脑</span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                    <span class="text-xs text-slate-400">离线 (3小时前活跃)</span>
                  </div>
                </div>
                <button disabled class="px-4 py-1.5 bg-slate-200 text-slate-400 text-xs font-bold rounded-lg cursor-not-allowed">连接</button>
              </div>
            </div>
          </div>
        </div>

        <footer class="px-8 py-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2 text-slate-400 text-xs">
          <iconify-icon icon="lucide:info" class="text-slate-500 text-sm"></iconify-icon>
          <span>您可以管理最多 5 台常用的受信任设备。</span>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
