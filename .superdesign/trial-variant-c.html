<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="view-transition" content="same-origin">
<title>鹊桥 · 远程协助</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');
  
  @view-transition { navigation: auto; }
  
  :root {
    --primary: #2563eb;
    --surface: #ffffff;
    --bg: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
  }

  body {
    margin: 0;
    background-color: #f1f5f9;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app-window {
    width: 840px;
    height: 520px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0, 0, 0, 0.1);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0,0,0,0.05);
  }

  .num-font {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .zone-card {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .zone-card:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 1px var(--primary), 0 4px 12px -2px rgba(37, 99, 235, 0.1);
  }

  .logo-icon {
    background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
  }
</style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center">
    <div class="app-window">
      <!-- Windows Title Bar -->
      <div class="h-9 bg-slate-50 flex items-center px-4 border-bottom border-slate-200 select-none">
        <div class="flex items-center gap-2 text-slate-500 text-[13px]">
          <iconify-icon icon="lucide:bridge" class="text-blue-600 text-sm"></iconify-icon>
          <span class="font-medium">鹊桥 (Remote Assist)</span>
        </div>
        <div class="ml-auto flex items-center gap-6 text-slate-400 text-sm">
          <iconify-icon icon="lucide:minus" id="win-min" class="hover:text-slate-600 cursor-pointer"></iconify-icon>
          <iconify-icon icon="lucide:square" id="win-max" class="text-[10px] hover:text-slate-600 cursor-pointer"></iconify-icon>
          <iconify-icon icon="lucide:x" id="win-close" class="hover:text-red-500 cursor-pointer"></iconify-icon>
        </div>
      </div>

      <!-- Client Area -->
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="pt-6 px-8 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="logo-icon w-8 h-8 rounded-lg flex items-center justify-center">
              <iconify-icon icon="lucide:share-2" class="text-white text-lg"></iconify-icon>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">鹊桥</h1>
          </div>
          <a href="#" id="nav-settings" class="flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors px-2 py-1 rounded-md hover:bg-slate-50">
            <iconify-icon icon="lucide:settings-2" class="text-lg"></iconify-icon>
            <span>设置</span>
          </a>
        </header>

        <div class="px-8 mt-1.5 text-slate-500 text-sm">
          建立安全的桌面连接，亲友互助从此简单。
        </div>

        <!-- Main Zones -->
        <main class="flex-1 flex gap-5 px-8 py-6 min-h-0">
          <!-- Request Help -->
          <div class="zone-card flex-1 border border-slate-200 rounded-2xl p-6 flex flex-col bg-white">
            <div class="mb-4">
              <h2 class="text-lg font-bold text-slate-900 mb-1">请人帮我</h2>
              <p class="text-sm text-slate-500 leading-relaxed">生成临时凭证，让信任的亲友远程查看或操作您的电脑。</p>
            </div>

            <div class="space-y-4 flex-1">
              <div class="flex items-start gap-3">
                <span class="num-font w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">1</span>
                <p class="text-sm text-slate-600">点击下方按钮开启协助状态</p>
              </div>
              <div class="flex items-start gap-3">
                <span class="num-font w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">2</span>
                <p class="text-sm text-slate-600">将显示的 6 位凭证告知对方</p>
              </div>
              <div class="flex items-start gap-3">
                <span class="num-font w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">3</span>
                <p class="text-sm text-slate-600">在弹出的确认框中点击「允许协助」</p>
              </div>
            </div>

            <div class="mt-auto">
              <button id="btn-start-assist" class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all shadow-sm shadow-blue-200 active:scale-[0.98]">
                开启接受协助
              </button>
            </div>
          </div>

          <!-- Provide Help -->
          <div class="zone-card flex-1 border border-slate-200 rounded-2xl p-6 flex flex-col bg-white">
            <div class="mb-4">
              <h2 class="text-lg font-bold text-slate-900 mb-1">我帮别人</h2>
              <p class="text-sm text-slate-500 leading-relaxed">输入亲友发给您的连接凭证，发起远程连接请求。</p>
            </div>

            <div class="space-y-5 flex-1">
              <div class="relative">
                <div class="flex items-center gap-2 mb-2">
                  <iconify-icon icon="lucide:key-round" class="text-slate-400"></iconify-icon>
                  <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">连接凭证</span>
                </div>
                <div class="relative">
                  <input type="text" placeholder="请输入 6 位数字凭证" class="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all text-slate-900 placeholder:text-slate-300">
                  <button id="btn-paste" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-blue-600 hover:text-blue-700 px-2 py-1">粘贴</button>
                </div>
              </div>

              <div class="space-y-3">
                <div class="flex items-start gap-3">
                  <span class="num-font w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">1</span>
                  <p class="text-sm text-slate-600">获取对方生成的连接凭证</p>
                </div>
                <div class="flex items-start gap-3">
                  <span class="num-font w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">2</span>
                  <p class="text-sm text-slate-600">粘贴至上方，点击下方连接按钮</p>
                </div>
              </div>
            </div>

            <div class="mt-auto space-y-3">
              <button id="btn-connect" disabled class="w-full h-11 bg-slate-100 text-slate-400 font-semibold rounded-xl cursor-not-allowed">
                发起连接
              </button>
              <div class="text-center">
                <a href="#" id="link-copy-guide" class="text-xs text-blue-600 hover:underline inline-flex items-center gap-1">
                  对方还没安装？复制安装说明
                  <iconify-icon icon="lucide:external-link" class="text-[10px]"></iconify-icon>
                </a>
              </div>
            </div>
          </div>
        </main>

        <!-- Footer -->
        <footer class="h-12 px-8 flex items-center border-t border-slate-100 bg-slate-50/50">
          <div class="flex items-center gap-2 text-slate-400 text-xs">
            <iconify-icon icon="lucide:shield-check" class="text-emerald-500 text-sm"></iconify-icon>
            <span>安全提示：切勿将连接凭证透露给不信任的陌生人。</span>
          </div>
          <div class="ml-auto text-[10px] text-slate-300 uppercase tracking-widest font-bold">
            v2.4.0 stable
          </div>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
