<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
    
    :root {
      --primary: #2563eb;
      --surface: #ffffff;
      --background: #f1f5f9;
      --text-ink: #0f172a;
      --text-muted: #64748b;
      --line: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--background);
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-window {
      width: 840px;
      height: 480px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .title-bar {
      height: 40px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .window-controls {
      margin-left: auto;
      display: flex;
      gap: 16px;
      color: #94a3b8;
      font-size: 14px;
    }

    .zone-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1.5px solid var(--line);
    }

    .zone-card:hover {
      border-color: var(--primary);
      background-color: #f8faff;
    }

    .step-badge {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app-window">
    <!-- Title Bar -->
    <div class="title-bar select-none">
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 rounded-md bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center">
          <iconify-icon icon="lucide:bridge" class="text-white text-xs"></iconify-icon>
        </div>
        <span class="text-xs font-medium text-slate-500">鹊桥 (Remote Assist)</span>
      </div>
      <div class="window-controls">
        <iconify-icon icon="mdi:minus" class="cursor-pointer hover:text-slate-900"></iconify-icon>
        <iconify-icon icon="mdi:crop-square" class="cursor-pointer hover:text-slate-900"></iconify-icon>
        <iconify-icon icon="mdi:close" class="cursor-pointer hover:text-red-500"></iconify-icon>
      </div>
    </div>

    <!-- Header -->
    <div class="px-8 pt-6 pb-2 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">鹊桥</h1>
        <p class="text-sm text-slate-500 mt-1">亲友之间，发凭证或粘贴连接。</p>
      </div>
      <a id="settings-link" href="#" class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-600 transition-colors bg-slate-100 px-3 py-1.5 rounded-lg">
        <iconify-icon icon="lucide:settings" class="text-base"></iconify-icon>
        <span>设置</span>
      </a>
    </div>

    <!-- Main Zones -->
    <div class="flex-1 flex gap-6 px-8 py-4">
      <!-- Left Zone: Get Help -->
      <div class="zone-card flex-1 p-6 rounded-2xl flex flex-col">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
            <iconify-icon icon="lucide:user-plus" class="text-2xl"></iconify-icon>
          </div>
          <h2 class="text-lg font-semibold text-slate-900">请人帮我</h2>
        </div>
        <p class="text-sm text-slate-500 leading-relaxed mb-5">让你信任的人帮你查电脑。对方要改动时会先询问你，确保安全。</p>
        
        <div class="space-y-3 mb-auto">
          <div class="flex items-start gap-3">
            <span class="step-badge mt-0.5">1</span>
            <span class="text-sm text-slate-700">点「开启接受协助」</span>
          </div>
          <div class="flex items-start gap-3">
            <span class="step-badge mt-0.5">2</span>
            <span class="text-sm text-slate-700">复制连接凭证，发给帮你的人</span>
          </div>
          <div class="flex items-start gap-3">
            <span class="step-badge mt-0.5">3</span>
            <span class="text-sm text-slate-700">对方连上时，点「允许协助」</span>
          </div>
        </div>

        <button id="btn-start-assist" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition-all shadow-sm active:scale-[0.98] mt-4">
          开启接受协助
        </button>
      </div>

      <!-- Right Zone: Provide Help -->
      <div class="zone-card flex-1 p-6 rounded-2xl flex flex-col bg-slate-50/30">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <iconify-icon icon="lucide:monitor-play" class="text-2xl"></iconify-icon>
          </div>
          <h2 class="text-lg font-semibold text-slate-900">我帮别人</h2>
        </div>
        <p class="text-sm text-slate-500 leading-relaxed mb-4">粘贴对方发来的连接凭证，即可远程连接协助。</p>
        
        <div class="relative mb-5">
          <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
            <iconify-icon icon="lucide:key-round"></iconify-icon>
          </div>
          <input type="text" placeholder="粘贴连接凭证" class="w-full h-11 pl-9 pr-14 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 shadow-inner" readonly>
          <button id="paste-action" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-blue-600 hover:text-blue-700">
            粘贴
          </button>
        </div>

        <div class="space-y-3 mb-auto">
          <div class="flex items-start gap-3">
            <span class="step-badge mt-0.5">1</span>
            <span class="text-sm text-slate-700">让对方发来连接凭证</span>
          </div>
          <div class="flex items-start gap-3">
            <span class="step-badge mt-0.5">2</span>
            <span class="text-sm text-slate-700">粘贴到上面，点「连接」</span>
          </div>
        </div>

        <div class="mt-4 space-y-3">
          <button id="btn-connect" disabled class="w-full py-2.5 bg-slate-200 text-slate-400 cursor-not-allowed rounded-xl font-medium transition-all">
            连接
          </button>
          <a id="install-instruction" href="#" class="block text-center text-xs text-blue-600 hover:underline">
            对方还没装鹊桥？复制安装说明
          </a>
        </div>
      </div>
    </div>

    <!-- Footer Info -->
    <div class="px-8 py-4 bg-slate-50/80 border-t border-slate-100 flex items-center gap-2 text-slate-500 text-xs">
      <iconify-icon icon="lucide:shield-check" class="text-green-600 text-sm"></iconify-icon>
      <span>安全提醒：只把连接凭证私下发给你信任的人。协助过程中你可以随时中断。</span>
    </div>
  </div>

</body>
</html>
