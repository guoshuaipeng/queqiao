<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
  
  :root {
    --primary: #2563eb;
    --surface: #ffffff;
    --bg: #f8fafc;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
  }

  body {
    font-family: 'Noto Sans SC', "Microsoft YaHei UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app-window {
    width: 840px;
    height: 512px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0,0,0,0.05);
  }

  .title-bar {
    height: 32px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }

  .client-area {
    height: 480px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .setting-group {
    @apply mb-8 last:mb-0;
  }

  .setting-title {
    @apply text-sm font-bold text-slate-900 mb-3 flex items-center gap-2;
  }

  .radio-row {
    @apply flex items-center gap-3 p-3 rounded-xl border border-transparent hover:bg-slate-50 transition-all cursor-pointer;
  }

  .radio-row.active {
    @apply border-blue-100 bg-blue-50/50;
  }

  .radio-dot {
    @apply w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0 transition-all;
  }

  .active .radio-dot {
    @apply border-blue-600;
  }

  .active .radio-inner {
    @apply w-2.5 h-2.5 bg-blue-600 rounded-full scale-100 transition-transform;
  }

  .radio-inner {
    @apply scale-0;
  }

  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 10px;
  }
</style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <!-- Windows-like Client Window -->
  <div class="app-window flex flex-col">
    
    <!-- Title Bar -->
    <div class="title-bar">
      <span class="flex items-center gap-2">
        <iconify-icon icon="lucide:bridge" class="text-blue-600"></iconify-icon>
        鹊桥
      </span>
      <div class="ml-auto flex gap-4 text-gray-400">
        <iconify-icon icon="lucide:minus" class="cursor-pointer hover:text-gray-600"></iconify-icon>
        <iconify-icon icon="lucide:square" class="cursor-pointer hover:text-gray-600"></iconify-icon>
        <iconify-icon icon="lucide:x" class="cursor-pointer hover:text-red-500"></iconify-icon>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="client-area">
      
      <!-- Header Section -->
      <header class="px-8 pt-6 pb-2 flex items-center gap-4">
        <a id="nav-back" href="#" class="flex items-center justify-center w-8 h-8 rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-900 transition-all">
          <iconify-icon icon="lucide:chevron-left" class="text-xl"></iconify-icon>
        </a>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">设置</h1>
      </header>

      <!-- Scrollable Settings -->
      <main class="flex-1 px-8 py-4 overflow-y-auto custom-scrollbar">
        
        <!-- 1. Trust Settings -->
        <section class="setting-group">
          <h4 class="setting-title">
            <iconify-icon icon="lucide:shield-check" class="text-blue-600"></iconify-icon>
            对方要改这台电脑时
          </h4>
          <div class="space-y-2">
            <div class="radio-row active">
              <div class="radio-dot"><div class="radio-inner"></div></div>
              <div>
                <span class="text-[14px] font-semibold text-slate-900">每次询问</span>
                <p class="text-[13px] text-slate-500">对方改动前都会问你（推荐）</p>
              </div>
            </div>
            <div class="radio-row">
              <div class="radio-dot"><div class="radio-inner"></div></div>
              <div>
                <span class="text-[14px] font-semibold text-slate-900">宽松</span>
                <p class="text-[13px] text-slate-500">只有高风险改动才问你，其余会记下但不再打扰</p>
              </div>
            </div>
            <div class="radio-row">
              <div class="radio-dot"><div class="radio-inner"></div></div>
              <div>
                <span class="text-[14px] font-semibold text-slate-900">完全信任</span>
                <p class="text-[13px] text-slate-500">仅这次不再询问，但会记下</p>
              </div>
            </div>
          </div>
          <div class="mt-3 p-3 bg-slate-50 rounded-lg text-xs text-slate-500 leading-relaxed">
            高风险包括删除文件、关机、改权限等。如果对方只能查看，不会因为这个设置就能改你的电脑。
          </div>
        </section>

        <!-- 2. Server Settings -->
        <section class="setting-group">
          <h4 class="setting-title">
            <iconify-icon icon="lucide:server" class="text-blue-600"></iconify-icon>
            连接服务器
          </h4>
          <p class="text-xs text-slate-500 mb-3">一般不用改。只有对方或管理员告诉你换服务器时才改这里。</p>
          <div class="flex gap-2">
            <input type="text" value="121.196.45.81:17891" class="flex-1 h-10 bg-slate-50 border border-slate-200 rounded-lg px-3 font-mono text-xs focus:outline-none focus:border-blue-500 transition-colors">
            <button id="btn-save-server" class="px-5 h-10 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-all shadow-sm">保存</button>
            <button id="btn-reset-server" class="px-3 text-blue-600 hover:bg-blue-50 text-sm font-medium rounded-lg transition-colors">恢复默认</button>
          </div>
        </section>

        <!-- 3. MCP Settings -->
        <section class="setting-group">
          <h4 class="setting-title">
            <iconify-icon icon="lucide:cpu" class="text-blue-600"></iconify-icon>
            给 AI 助手用 (MCP)
          </h4>
          <div class="flex gap-3">
            <button id="btn-copy-mcp" class="flex-1 flex items-center justify-center gap-2 h-11 border border-slate-200 rounded-xl hover:bg-slate-50 text-slate-700 text-sm font-medium transition-all">
              <iconify-icon icon="lucide:copy" class="text-slate-400"></iconify-icon>
              复制 MCP 配置
            </button>
            <button id="btn-copy-guide" class="flex-1 flex items-center justify-center gap-2 h-11 border border-slate-200 rounded-xl hover:bg-slate-50 text-slate-700 text-sm font-medium transition-all">
              <iconify-icon icon="lucide:book-open" class="text-slate-400"></iconify-icon>
              复制使用说明
            </button>
          </div>
        </section>

        <!-- 4. About -->
        <section class="setting-group pb-4">
          <h4 class="setting-title">
            <iconify-icon icon="lucide:info" class="text-blue-600"></iconify-icon>
            关于
          </h4>
          <div class="flex items-center gap-4 text-sm">
            <span class="text-slate-500">版本 0.2.0</span>
            <div class="flex items-center gap-4">
              <a id="link-website" href="#" class="text-blue-600 hover:underline">官网</a>
              <a id="link-logs" href="#" class="text-blue-600 hover:underline">查看协助记录</a>
            </div>
          </div>
        </section>

      </main>

      <!-- Simple Footer with subtle indicator -->
      <footer class="px-8 py-3 bg-slate-50 border-t border-slate-100 flex justify-end">
        <span class="text-[11px] text-slate-400 uppercase tracking-widest">Remote Assist v0.2</span>
      </footer>
    </div>
  </div>
</body>
</html>
