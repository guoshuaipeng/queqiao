<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
  
  :root {
    --primary: #2563eb;
    --surface: #ffffff;
    --bg: #f8fafc;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
  }

  body {
    font-family: 'Noto Sans SC', "Microsoft YaHei UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app-window {
    width: 840px;
    height: 512px; 
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0,0,0,0.05);
  }

  .title-bar {
    height: 32px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }

  .client-area {
    height: 480px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .logo-gradient {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
  }

  .card-border {
    border: 1.5px solid var(--line);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-border:hover {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.04);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-online { background: #16a34a; box-shadow: 0 0 8px rgba(22, 163, 74, 0.3); }
  .status-offline { background: #94a3b8; }

  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="app-window flex flex-col">
      
      <!-- Title Bar -->
      <div class="title-bar">
        <span class="flex items-center gap-2">
          <iconify-icon icon="lucide:bridge" class="text-blue-600"></iconify-icon>
          鹊桥
        </span>
        <div class="ml-auto flex gap-4 text-gray-400">
          <iconify-icon icon="lucide:minus" class="cursor-pointer hover:text-gray-600"></iconify-icon>
          <iconify-icon icon="lucide:square" class="cursor-pointer hover:text-gray-600"></iconify-icon>
          <iconify-icon icon="lucide:x" class="cursor-pointer hover:text-red-500"></iconify-icon>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="client-area">
        
        <!-- Header / Navigation -->
        <header class="px-8 pt-6 pb-2 flex items-center gap-4">
          <a href="#" id="nav-back" class="flex items-center justify-center w-8 h-8 rounded-full text-slate-400 hover:bg-slate-100 transition-colors">
            <iconify-icon icon="lucide:chevron-left" class="text-xl"></iconify-icon>
          </a>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">个人中心</h1>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 px-8 py-4 overflow-y-auto custom-scrollbar flex flex-col gap-5">
          
          <!-- Account Card -->
          <div class="card-border bg-white rounded-xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="logo-gradient w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl font-bold">
                张
              </div>
              <div>
                <h3 class="font-bold text-slate-900">zhang_wei</h3>
                <p class="text-sm text-slate-500">已通过手机号登录 · <span class="text-green-600">安全受保护</span></p>
              </div>
            </div>
            <button id="btn-logout" class="text-sm font-medium text-slate-400 hover:text-red-500 transition-colors px-3 py-1.5">
              退出登录
            </button>
          </div>

          <!-- Direct Access Toggle -->
          <div class="card-border bg-slate-50/50 rounded-xl p-4 flex items-center justify-between">
            <div class="flex-1 pr-4">
              <div class="flex items-center gap-2 mb-0.5">
                <iconify-icon icon="lucide:globe" class="text-blue-600"></iconify-icon>
                <span class="font-semibold text-slate-900">允许我的账号连接这台电脑</span>
              </div>
              <p class="text-[13px] text-slate-500">开启后，您在其他设备登录时可直接访问本机，无需输入连接凭证。</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <div class="w-11 h-6 bg-blue-600 rounded-full transition-colors"></div>
              <div class="absolute left-6 top-1 w-4 h-4 bg-white rounded-full transition-transform"></div>
            </div>
          </div>

          <!-- Device List Section -->
          <section class="flex flex-col flex-1">
            <div class="flex items-center justify-between mb-3 px-1">
              <div class="flex items-center gap-2">
                <h2 class="font-bold text-slate-900">我的设备</h2>
                <span class="text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">在线设备可一键连接</span>
              </div>
              <button id="btn-refresh" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded-md text-xs font-medium flex items-center gap-1">
                <iconify-icon icon="lucide:refresh-cw"></iconify-icon>
                刷新列表
              </button>
            </div>

            <div class="space-y-3 pb-4">
              <!-- Device Item: Local -->
              <div class="card-border bg-white rounded-xl p-4 flex items-center">
                <div class="status-dot status-online mr-4"></div>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold text-slate-900">家里的台式机</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded-md border border-blue-100">本机</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5">Windows · 杭州 · 正在运行</p>
                </div>
                <div class="text-xs text-slate-400 font-medium">当前正在使用</div>
              </div>

              <!-- Device Item: Online -->
              <div class="card-border bg-white rounded-xl p-4 flex items-center">
                <div class="status-dot status-online mr-4"></div>
                <div class="flex-1">
                  <span class="font-semibold text-slate-900">公司笔记本</span>
                  <p class="text-xs text-slate-500 mt-0.5">Windows · 上海 · 1小时前活跃</p>
                </div>
                <button id="btn-connect-comp" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-all shadow-sm hover:shadow-md">
                  连接
                </button>
              </div>

              <!-- Device Item: Offline -->
              <div class="card-border bg-white rounded-xl p-4 flex items-center">
                <div class="status-dot status-offline mr-4"></div>
                <div class="flex-1">
                  <span class="font-semibold text-slate-900 text-slate-400">书房电脑</span>
                  <p class="text-xs text-slate-400 mt-0.5">Windows · 离线</p>
                </div>
                <button disabled class="px-4 py-1.5 bg-slate-100 text-slate-400 text-sm font-semibold rounded-lg cursor-not-allowed">
                  离线
                </button>
              </div>
            </div>
          </section>

        </main>

        <!-- Safety Footer -->
        <footer class="px-8 py-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2 text-slate-400 text-[12px]">
          <iconify-icon icon="lucide:lock" class="text-blue-500"></iconify-icon>
          <span>仅限同一账号设备间连接。如需协助他人，请返回首页使用连接凭证。</span>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
