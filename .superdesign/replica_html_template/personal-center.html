<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹊桥 · 个人中心（账号与设备，结构稿）</title>
<style>
  :root{--blue:#2563eb;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--green:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .win{width:840px;border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.18);background:#fff}
  .titlebar{height:32px;background:#f1f5f9;display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
  .titlebar .dots{margin-left:auto;letter-spacing:14px}
  .client{height:480px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;padding:14px 24px 6px}
  .back{font-size:14px;color:var(--blue)}
  .body{padding:8px 24px 16px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow:hidden}
  .acct{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
  .avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .acct .name{font-size:16px;font-weight:700}
  .acct .meta{font-size:13px;color:var(--sub)}
  .link{color:var(--blue);font-size:13px;cursor:pointer}
  .btn{height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:13px;font-family:inherit}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .sec{font-size:14px;font-weight:600}
  .hint{font-size:13px;color:var(--sub)}
  .toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  .sw{width:36px;height:20px;border-radius:999px;background:var(--blue);position:relative;flex:none}
  .sw::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
  .list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto}
  .dev{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .dot.off{background:#94a3b8}
  .dev .title{font-size:14px;font-weight:600}
  .dev .sub{font-size:12px;color:var(--sub)}
  .spacer{flex:1}
</style>
</head>
<body>
<div class="win"><div class="titlebar">鹊桥<span class="dots">— ☐ ✕</span></div>
<div class="client">
  <div class="top"><span class="back">← 返回</span><span style="margin-left:14px;font-size:18px;font-weight:700">个人中心</span></div>
  <div class="body">
    <div class="acct">
      <div class="avatar">张</div>
      <div>
        <div class="name">zhang_wei</div>
        <div class="meta">已登录 · 可管理自己的电脑</div>
      </div>
      <div class="spacer"></div>
      <span class="link">退出登录</span>
    </div>

    <div class="toggle">
      <div class="sw"></div>
      <div>
        <div class="sec">允许我的账号连接这台电脑</div>
        <div class="hint">打开后，你的其他已登录设备能在列表里看到并连接本机。关掉或退出后会离线。</div>
      </div>
    </div>

    <div class="row-head" style="display:flex;align-items:center;gap:10px">
      <div class="sec">我的设备</div>
      <span class="hint">在线设备可直接连接，不必再输会话码</span>
      <div class="spacer"></div>
      <button class="btn">刷新</button>
    </div>

    <div class="list">
      <div class="dev">
        <span class="dot"></span>
        <div>
          <div class="title">家里的台式机</div>
          <div class="sub">Windows · 在线 · 本机</div>
        </div>
        <div class="spacer"></div>
        <span class="hint">当前这台</span>
      </div>
      <div class="dev">
        <span class="dot"></span>
        <div>
          <div class="title">公司笔记本</div>
          <div class="sub">Windows · 在线</div>
        </div>
        <div class="spacer"></div>
        <button class="btn primary">连接</button>
      </div>
      <div class="dev">
        <span class="dot off"></span>
        <div>
          <div class="title">书房电脑</div>
          <div class="sub">Windows · 离线</div>
        </div>
        <div class="spacer"></div>
        <button class="btn" disabled>连接</button>
      </div>
    </div>
  </div>
</div></div>
</body>
</html>
