[package]
name = "queqiao-tauri"
version = "0.1.0"
description = "鹊桥 Tauri v2 客户端壳（D0）"
authors = ["鹊桥"]
edition = "2021"

[lib]
name = "queqiao_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
