<svg xmlns="http://www.w3.org/2000/svg" width="888" height="640" viewBox="0 0 888 640"><rect x="0" y="0" width="888" height="640" rx="0" fill="#eef2f6"/><text x="24" y="29" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#20334a" font-weight="700">02 左等待对方连接 · 右侧空闲</text><text x="24" y="51" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#97531e">设计示意 · 非真实截图 · 不是 UI 验收 PASS</text><rect x="24" y="60" width="840" height="28" rx="6" fill="#dce4ee"/><text x="36" y="80" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#53677d">鹊桥  /  系统标题栏示意</text><rect x="24" y="88" width="840" height="480" rx="0" fill="#ffffff" stroke="#bccbdc" stroke-width="1"/><text x="24" y="598" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#53677d">客户区 840×480 DIP；切态不改外框。图标仅待验收，不表示已修。</text><text x="48" y="117" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#20334a" font-weight="700">亲友协助，从这里开始</text><text x="48" y="140" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#52677d">发出自己的凭证，或粘贴对方发来的完整凭证。</text><rect x="48" y="168" width="376" height="244" rx="8" fill="#fbfdff" stroke="#d6e0eb" stroke-width="1"/><text x="66" y="200" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#20334a" font-weight="700">请人帮我</text><text x="66" y="227" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#52677d">先开启接受协助，再把凭证发给对方。</text><rect x="440" y="168" width="376" height="244" rx="8" fill="#fbfdff" stroke="#d6e0eb" stroke-width="1"/><text x="458" y="200" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#20334a" font-weight="700">我帮别人</text><text x="458" y="227" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#52677d">粘贴完整连接凭证，然后点连接。</text><text x="66" y="257" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#166d50" font-weight="700">● 等待对方连接</text><rect x="66" y="270" width="340" height="43" rx="4" fill="#ecf4ff"/><text x="78" y="297" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#4c6380">演示占位 · 非连接凭证</text><rect x="66" y="327" width="158" height="38" rx="5" fill="#1965cf"/><text x="80" y="352" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#ffffff" font-weight="700">复制连接凭证</text><rect x="234" y="327" width="110" height="38" rx="5" fill="#ffffff" stroke="#c9d4e1" stroke-width="1"/><text x="248" y="352" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#25415e">停止接受</text><text x="66" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#52677d">停止成功后，才回到未开启状态。</text><text x="458" y="256" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#20334a">粘贴连接凭证</text><rect x="458" y="269" width="340" height="54" rx="4" fill="#ffffff" stroke="#c5d2e1" stroke-width="1"/><text x="469" y="299" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#75869a">在这里粘贴对方发来的完整内容</text><rect x="458" y="339" width="90" height="38" rx="5" fill="#e8edf3"/><text x="472" y="364" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#8391a3">连接</text><text x="561" y="365" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#75869a">空输入时不可连接</text><rect x="48" y="436" width="792" height="1" rx="0" fill="#dce5ef"/><text x="48" y="467" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#20334a">请人帮我：开启 → 发凭证 → 等对方连接</text><text x="48" y="497" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#20334a">我帮别人：粘贴完整凭证 → 点连接</text><text x="48" y="537" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#52677d">只把连接凭证私下发给你信任、愿意请其帮忙的人。</text><text x="24" y="624" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#8b5a2a">技术注：Waiting 留入口；必须有停止接受；不能与右侧建连并行。</text></svg>