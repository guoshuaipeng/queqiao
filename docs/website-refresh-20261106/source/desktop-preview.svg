<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1760" viewBox="0 0 1280 1760">
  <rect width="100%" height="100%" fill="#E8EAED"/>
  <text x="24" y="24" font-size="13" fill="#8A4B08" font-family="sans-serif">【图外】草案 · 非现网 · 仅演示「确认未发布」分支文案</text>
  <text x="24" y="44" font-size="11" fill="#5F6368" font-family="sans-serif">现网入口待核；不代表撤销已有链接。未核≠未发布。分支A示意见页底。</text>
  <rect x="40" y="60" width="1200" height="1480" fill="#fff"/>
  <rect x="40" y="60" width="1200" height="32" fill="#DADCE0"/>
  <text x="68" y="110" font-size="18" font-weight="700" fill="#1A73E8" font-family="sans-serif">鹊桥</text>
  <text x="540" y="110" font-size="13" fill="#3C4043" font-family="sans-serif">如何使用　Windows　帮助　安全与隐私</text>
  <rect x="1060" y="88" width="150" height="44" rx="6" fill="#fff" stroke="#80868B"/>
  <text x="1090" y="116" font-size="13" fill="#5F6368" font-family="sans-serif">留言咨询</text>
  <rect x="40" y="144" width="1200" height="190" fill="#E8F0FE"/>
  <text x="80" y="186" font-size="26" font-weight="700" fill="#202124" font-family="sans-serif">帮亲友处理电脑问题，少一点来回解释。</text>
  <text x="80" y="220" font-size="14" fill="#5F6368" font-family="sans-serif">鹊桥帮助亲友远程处理电脑问题。使用前请先阅读本页说明。</text>
  <rect x="80" y="244" width="190" height="48" rx="8" fill="#1A73E8"/>
  <text x="108" y="274" font-size="14" fill="#fff" font-family="sans-serif">了解如何试用</text>
  <rect x="286" y="244" width="174" height="48" rx="8" fill="#fff" stroke="#1A73E8" stroke-width="2"/>
  <text x="308" y="274" font-size="14" fill="#1A73E8" font-family="sans-serif">第一次怎么用</text>
  <text x="80" y="380" font-size="18" font-weight="700" fill="#202124" font-family="sans-serif">开始使用</text>
  <rect x="80" y="396" width="1120" height="90" rx="8" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="96" y="432" font-size="15" fill="#202124" font-family="sans-serif">请先阅读下方说明，再在电脑上打开鹊桥。</text>
  <text x="96" y="460" font-size="13" fill="#5F6368" font-family="sans-serif">用手机可以阅读说明；请在电脑上完成安装与连接。</text>
  <text x="80" y="530" font-size="18" font-weight="700" fill="#202124" font-family="sans-serif">第一次怎么用</text>
  <rect x="80" y="546" width="540" height="150" rx="8" fill="#E8F0FE" stroke="#AECBFA"/>
  <text x="96" y="576" font-size="14" font-weight="700" fill="#174EA6" font-family="sans-serif">需要帮助的人</text>
  <text x="96" y="606" font-size="12" fill="#3C4043" font-family="sans-serif">打开 → 开启接受并私下发完整凭证 → 结束后停止</text>
  <rect x="660" y="546" width="540" height="150" rx="8" fill="#E6F4EA" stroke="#A8DAB5"/>
  <text x="676" y="576" font-size="14" font-weight="700" fill="#0D652D" font-family="sans-serif">来帮忙的人</text>
  <text x="676" y="606" font-size="12" fill="#3C4043" font-family="sans-serif">打开 → 粘贴完整凭证后发起连接 → 结束后断开</text>
  <text x="80" y="740" font-size="18" font-weight="700" fill="#202124" font-family="sans-serif">安全与隐私</text>
  <rect x="80" y="756" width="1120" height="64" rx="8" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="96" y="794" font-size="14" fill="#3C4043" font-family="sans-serif">仅与信任的人协助，保管好连接凭证；结束连接不代表凭证永久失效。</text>
  <text x="80" y="870" font-size="18" font-weight="700" fill="#202124" font-family="sans-serif">常见问题</text>
  <rect x="80" y="886" width="1120" height="160" rx="8" fill="#fff" stroke="#DADCE0"/>
  <text x="96" y="920" font-size="13" fill="#3C4043" font-family="sans-serif">怎么开始？见「第一次怎么用」。　手机能装吗？请在电脑上使用。</text>
  <text x="96" y="950" font-size="13" fill="#3C4043" font-family="sans-serif">两个软件吗？同一程序。　想留言？可自愿留言咨询。</text>
  <rect x="40" y="1080" width="1200" height="88" fill="#202124"/>
  <text x="80" y="1112" font-size="13" fill="#E8EAED" font-family="sans-serif">留言咨询（自愿）</text>
  <rect x="80" y="1124" width="150" height="40" rx="6" fill="#3C4043"/>
  <text x="118" y="1150" font-size="14" fill="#fff" font-family="sans-serif">去留言</text>
  <text x="24" y="1220" font-size="12" fill="#8A4B08" font-family="sans-serif">【图外 · 分支 A 示意】有授权且可验证真实包时</text>
  <rect x="40" y="1236" width="660" height="90" rx="8" fill="#fff" stroke="#1A73E8"/>
  <text x="56" y="1264" font-size="13" fill="#202124" font-family="sans-serif">版本/日期/大小：图外待填</text>
  <rect x="56" y="1280" width="320" height="36" rx="6" fill="#1A73E8"/>
  <text x="70" y="1304" font-size="12" fill="#fff" font-family="sans-serif">下载 Windows 试用版（需满足图外条件）</text>
  <text x="24" y="1360" font-size="11" fill="#5F6368" font-family="sans-serif">未核时保留现状；Linux 入口去留由服务端核验与产品收口。</text>
</svg>
