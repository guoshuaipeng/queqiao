<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1900" viewBox="0 0 430 1900">
  <rect width="100%" height="100%" fill="#E8EAED"/>
  <text x="12" y="22" font-size="11" fill="#8A4B08" font-family="sans-serif">【图外】草案·非现网·仅演示确认未发布分支</text>
  <text x="12" y="40" font-size="10" fill="#5F6368" font-family="sans-serif">不代表撤销已有链接 · 未核≠未发布</text>
  <rect x="12" y="52" width="406" height="1580" fill="#fff"/>
  <text x="26" y="78" font-size="16" font-weight="700" fill="#1A73E8" font-family="sans-serif">鹊桥</text>
  <rect x="12" y="100" width="406" height="240" fill="#E8F0FE"/>
  <text x="26" y="136" font-size="17" font-weight="700" fill="#202124" font-family="sans-serif">帮亲友处理电脑问题，</text>
  <text x="26" y="162" font-size="17" font-weight="700" fill="#202124" font-family="sans-serif">少一点来回解释。</text>
  <text x="26" y="192" font-size="13" fill="#5F6368" font-family="sans-serif">使用前请先阅读本页说明。</text>
  <rect x="26" y="214" width="378" height="48" rx="8" fill="#1A73E8"/>
  <text x="130" y="244" font-size="14" fill="#fff" font-family="sans-serif">了解如何试用</text>
  <rect x="26" y="272" width="378" height="48" rx="8" fill="#fff" stroke="#1A73E8" stroke-width="2"/>
  <text x="130" y="302" font-size="14" fill="#1A73E8" font-family="sans-serif">第一次怎么用</text>
  <text x="26" y="380" font-size="16" font-weight="700" fill="#202124" font-family="sans-serif">开始使用</text>
  <rect x="22" y="396" width="386" height="80" rx="8" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="36" y="428" font-size="14" fill="#202124" font-family="sans-serif">请先阅读说明，再在电脑上打开鹊桥。</text>
  <text x="36" y="456" font-size="12" fill="#5F6368" font-family="sans-serif">手机可阅读本页说明。</text>
  <text x="26" y="520" font-size="16" font-weight="700" fill="#202124" font-family="sans-serif">第一次怎么用</text>
  <rect x="22" y="536" width="386" height="110" rx="8" fill="#E8F0FE" stroke="#AECBFA"/>
  <text x="36" y="564" font-size="13" font-weight="700" fill="#174EA6" font-family="sans-serif">需要帮助的人</text>
  <text x="36" y="592" font-size="12" fill="#3C4043" font-family="sans-serif">打开 → 开启接受并私下发凭证 → 结束后停止</text>
  <rect x="22" y="660" width="386" height="110" rx="8" fill="#E6F4EA" stroke="#A8DAB5"/>
  <text x="36" y="688" font-size="13" font-weight="700" fill="#0D652D" font-family="sans-serif">来帮忙的人</text>
  <text x="36" y="716" font-size="12" fill="#3C4043" font-family="sans-serif">打开 → 粘贴凭证后发起连接 → 结束后断开</text>
  <text x="26" y="820" font-size="16" font-weight="700" fill="#202124" font-family="sans-serif">安全与隐私</text>
  <rect x="22" y="836" width="386" height="90" rx="8" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="36" y="872" font-size="13" fill="#3C4043" font-family="sans-serif">仅与信任的人协助，保管好连接凭证；</text>
  <text x="36" y="898" font-size="13" fill="#3C4043" font-family="sans-serif">结束连接不代表凭证永久失效。</text>
  <text x="26" y="970" font-size="16" font-weight="700" fill="#202124" font-family="sans-serif">常见问题</text>
  <rect x="22" y="986" width="386" height="140" rx="8" fill="#fff" stroke="#DADCE0"/>
  <text x="36" y="1020" font-size="12" fill="#3C4043" font-family="sans-serif">怎么开始？见上方步骤。　手机请在电脑使用。</text>
  <text x="36" y="1048" font-size="12" fill="#3C4043" font-family="sans-serif">同一程序不同用法。　可自愿留言。</text>
  <rect x="12" y="1160" width="406" height="100" fill="#202124"/>
  <text x="26" y="1192" font-size="12" fill="#E8EAED" font-family="sans-serif">留言咨询（自愿）</text>
  <rect x="26" y="1204" width="378" height="44" rx="8" fill="#3C4043"/>
  <text x="160" y="1232" font-size="14" fill="#fff" font-family="sans-serif">去留言</text>
  <text x="12" y="1300" font-size="11" fill="#8A4B08" font-family="sans-serif">【图外·分支A】下载示意按钮 · 无真链无版本</text>
  <rect x="12" y="1316" width="406" height="70" rx="8" fill="#fff" stroke="#1A73E8"/>
  <rect x="26" y="1334" width="378" height="36" rx="6" fill="#1A73E8"/>
  <text x="70" y="1358" font-size="12" fill="#fff" font-family="sans-serif">下载 Windows 试用版（需满足图外条件）</text>
  <text x="12" y="1420" font-size="10" fill="#5F6368" font-family="sans-serif">未核保留现状；Linux 去留产品收口。</text>
</svg>
