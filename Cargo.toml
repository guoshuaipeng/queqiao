[workspace]
resolver = "2"
members = [
  "crates/queqiao-protocol",
  "apps/queqiao-mcp",
]
exclude = [
  "apps/queqiao-tauri/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
